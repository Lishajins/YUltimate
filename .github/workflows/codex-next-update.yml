name: Temporary Next.js security lockfile update
on:
  push:
    branches:
      - codex/trivy-next-remediation
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve Next.js and update lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Apply remaining non-breaking audit fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --prefix frontend
      - name: Commit only the Next.js manifest and lockfile
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo 'No dependency changes were produced.'
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              frontend/package.json|frontend/package-lock.json) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "fix(deps): update vulnerable Next.js dependencies"
          git push origin HEAD:refs/heads/codex/trivy-next-remediation